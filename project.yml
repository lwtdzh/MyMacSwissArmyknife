name: MyMacSwissArmyknife
options:
  bundleIdPrefix: com.mymacswissarmyknife
  deploymentTarget:
    macOS: "13.5"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_SWIFT_FLAGS: "$(inherited) -file-prefix-map $(SRCROOT)=."
    SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
    OTHER_CFLAGS: "$(inherited) -ffile-prefix-map=$(SRCROOT)=."
    OTHER_CPLUSPLUSFLAGS: "$(inherited) -ffile-prefix-map=$(SRCROOT)=."
    MACOSX_DEPLOYMENT_TARGET: "13.5"
    REGISTER_WITH_LAUNCH_SERVICES: NO
targets:
  MyMacSwissArmyknife:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - RightClickMenuExtension
    dependencies:
      - target: RightClickMenuExtension
        embed: true
        link: false
    settings:
      base:
        PRODUCT_NAME: MyMacSwissArmyknife
        PRODUCT_BUNDLE_IDENTIFIER: com.mymacswissarmyknife.host
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Build and embed modules
        script: |
          "${SRCROOT}/Scripts/build-modules.sh" \
            "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ResourceMonitor.app/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ResourceMonitor.app/Contents/MacOS/ResourceMonitor
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ClipyEnhanced.app/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ClipyEnhanced.app/Contents/MacOS/ClipyEnhanced
        basedOnDependencyAnalysis: false
  RightClickMenuExtension:
    type: app-extension
    platform: macOS
    sources:
      - Sources/RightClickMenuShared
      - path: Sources/RightClickMenuExtension
        excludes:
          - Info.plist
          - RightClickMenuExtension.entitlements
    settings:
      base:
        PRODUCT_NAME: RightClickMenuExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.mymacswissarmyknife.host.RightClickMenuExtension
        INFOPLIST_FILE: Sources/RightClickMenuExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/RightClickMenuExtension/RightClickMenuExtension.entitlements
        RIGHT_CLICK_MENU_DISPLAY_NAME: RightClickMenu
        RIGHT_CLICK_MENU_PROVIDER_ROLE: all
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  MyMacSwissArmyknifeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MyMacSwissArmyknifeTests
    dependencies:
      - target: MyMacSwissArmyknife
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  MyMacSwissArmyknife:
    build:
      targets:
        MyMacSwissArmyknife: all
        MyMacSwissArmyknifeTests: [test]
    test:
      targets:
        - MyMacSwissArmyknifeTests
